name: Auto Release New APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g., 1.0.1)'
        required: false
        default: ''
      changelog:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Automated release with performance enhancements and bug fixes'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Extract Release Version & Notes
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
          else
            VERSION_NAME=$(node -p "require('./version.json').versionName" 2>/dev/null || echo "${GITHUB_REF_NAME#v}")
          fi
          
          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            CHANGELOG="${{ github.event.inputs.changelog }}"
          else
            CHANGELOG=$(node -p "require('./version.json').changelog" 2>/dev/null || echo "Release $VERSION_NAME")
          fi
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION_NAME" >> $GITHUB_OUTPUT
          
          # Multi-line changelog output
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/CrossAIStudio-release.apk
          ls -lh release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          name: "CrossAIStudio v${{ steps.release_info.outputs.VERSION_NAME }}"
          body: ${{ steps.release_info.outputs.CHANGELOG }}
          files: release_assets/CrossAIStudio-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

